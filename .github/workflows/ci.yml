name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/BTCPayServer.Plugins.Stablecoins -c Release
      - name: Test
        run: dotnet test --project tests/BTCPayServer.Plugins.Stablecoins.Tests -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the payment panel
        working-directory: client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
